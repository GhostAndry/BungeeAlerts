server_name: "server"

alert_message: "&8[&5&lAntiCheat&8] &7(%server%) &d%player% &7> &d%check% &8(&d%vl%&8)"

redis:
    host: localhost
    port: 6379
    channel: "bungeealerts"

# This is a command to register every check flagged by a player.
aclogs:
    # if enabled the plugin will log every check flagged by a player.
    # and save it in a MySQL database.
    enabled: true
    message: "&7(%time%) &d%player% &7> &d%check% &8(&d%vl%&8) &8[&d%server%&8]"
    paginated: "&dAC Logs for %player% (Page %page% of %total_pages%)."
    next-page: "Pagina successiva... (> Page %page% of %total_pages%)"
    not-found: "&cNessun log trovato per %player%."
    mysql:
        host: "localhost"
        port: 3306
        database: "aclogs"
        username: "root"
        password: "password"