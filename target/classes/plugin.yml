name: BungeeAlerts
version: '1.0'
main: me.ghostdevelopment.bungeealerts.BungeeAlerts
load: STARTUP
api-version: 1.21
author: GhostAndry

commands:
  bungeealerts:
    description: 'Command to see alerts from any server'
    aliases:
      - balerts
  aclogs:
    description: 'See every log'
  testalert:
    description: 'Test alerts from any server'
    aliases:
      - talerts
    usage: '/testalerts <player> <check> <vl>'
    permission: bungeealerts.use

permissions:
  bungeealerts.use:
    description: 'Permission to use /bungeealerts command'
  bungeealerts.test:
    description: 'Permission to use /testalert command'
  bungeealerts.reload:
    description: 'Permission to reload BungeeAlerts configuration'